<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sıla ❤️</title>
<style>
body {
    background: black;
    color: red;
    font-family: monospace;
    white-space: pre;
    text-align: center;
    font-size: 12px;
}
</style>
</head>
<body>

<script>
let heart = "";
for (let y = 12; y > -12; y--) {
    for (let x = -30; x < 30; x++) {
        let formula = Math.pow(Math.pow(x*0.05,2) + Math.pow(y*0.1,2) - 1,3) 
                      - Math.pow(x*0.05,2) * Math.pow(y*0.1,3);
        heart += (formula <= 0) ? "❤️" : " ";
    }
    heart += "\n";
}
document.body.innerText = heart + "\n\nSeni seviyorum Sıla ❤️";
</script>

</body>
</html>
